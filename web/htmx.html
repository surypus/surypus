<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surypus — HTMX консоль</title>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>Surypus</h1>

    <section hx-get="/api/v1/health" hx-trigger="load, every 30s" hx-swap="innerHTML">
      <p>Проверка состояния сервера…</p>
    </section>

    <section>
      <h2>Товары и склад</h2>
      <p>Справочник товаров и складские движения served from the canonical API.</p>
      <table>
        <thead><tr><th>Код</th><th>Наименование</th><th>Остаток</th></tr></thead>
        <tbody id="goods">
          <tr><td colspan="3">Загрузка через /api/v1 …</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
