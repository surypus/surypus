name: SURYPUS Phase 3
on:
  push:
    branches: [ main, phase3 ]
  pull_request:
    branches: [ main, phase3 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-qemu-action@v4
      - name: Build surypus-server image
        run: |
          docker build -t surypus:latest .
      - name: Run tests
        run: |
          docker run --rm surypus:latest surypus-server --version || true
          echo "Integration tests would run here"
