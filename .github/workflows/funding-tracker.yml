name: Funding Tracker

on:
  schedule:
    - cron: '0 9 1 * *'  # Monthly on 1st at 9 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect funding metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const body = `## 💰 Funding Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Repository Stats
            | Metric | Value |
            |--------|-------|
            | Stars | ${repo.stargazers_count} |
            | Forks | ${repo.forks_count} |
            | Watchers | ${repo.watchers_count} |
            
            ### Funding Links
            - [GitHub Sponsors](https://github.com/sponsors/dominicusin)
            - [Open Collective](https://opencollective.com/surypus)
            - [Sponsorship Tiers](SPONSORSHIP.md)
            
            ### How to Support
            See [FUNDING.md](FUNDING.md) for all ways to support Surypus.
            
            ---
            *This issue was automatically generated by the Funding Tracker workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `💰 Monthly Funding Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
