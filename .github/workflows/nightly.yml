name: Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        resolver: ['lts', 'nightly']
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Configure resolver
        run: |
          if [ "${{ matrix.resolver }}" = "nightly" ]; then
            stack config set resolver nightly
          fi
          echo "Using resolver: ${{ matrix.resolver }}"

      - name: Build with Stack Nightly
        continue-on-error: true
        run: |
          stack build --test --no-run-tests 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning::Build failed with ${{ matrix.resolver }}"
          fi

      - name: Run tests
        continue-on-error: true
        run: |
          stack test 2>&1 | tee test.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning::Tests failed with ${{ matrix.resolver }}"
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed: ${{ matrix.resolver }}`,
              body: `Nightly build with ${{ matrix.resolver }} resolver failed.\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'priority: high', 'status: needs-triage']
            })
