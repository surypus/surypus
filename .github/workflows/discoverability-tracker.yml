name: Discoverability Tracker

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discoverability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Track discoverability metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            // Search for mentions of the project
            const { data: searchResults } = await github.rest.search.repos({
              q: 'surypus+erp+haskell',
              per_page: 100
            });
            
            const body = `## 🔍 Discoverability Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Repository Metadata
            | Field | Value |
            |-------|-------|
            | Description | ${repo.description} |
            | Topics | ${repo.topics?.join(', ') || 'None'} |
            | Homepage | ${repo.homepage || 'None'} |
            | Language | ${repo.language} |
            | License | ${repo.license?.spdx_id || 'None'} |
            
            ### GitHub Search Results
            | Metric | Value |
            |--------|-------|
            | Search Results | ${searchResults.total_count} |
            
            ### Recommendations
            - 📝 Ensure README.md is comprehensive
            - 🏷️ Use relevant topics for discoverability
            - 📚 Publish to Hackage and Stackage
            - 🌐 Create project website
            - 📰 Write blog posts and tutorials
            - 🎥 Create video content
            - 💬 Engage with Haskell community
            - 📦 Publish to package registries
            
            ---
            *This issue was automatically generated by the Discoverability workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Weekly Discoverability Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
