name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Setup Stack and GHC
        run: |
          curl -sSL https://get.haskellstack.org/ | sh -s - -f
          stack setup --no-nix

      - name: Build library and tests
        run: |
          stack --no-nix build --test --no-run-tests --no-haddock-deps

      - name: Run tests
        run: |
          stack --no-nix test --test-arguments --color