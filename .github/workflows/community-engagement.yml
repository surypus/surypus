name: Community & Contributor Engagement

on:
  schedule:
    - cron: '0 10 * * 3'  # Weekly on Wednesday at 10 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Contributor engagement
        uses: actions/github-script@v9
        with:
          script: |
            const { data: contributors } = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const openIssues = issues.filter(i => !i.pull_request);
            const openPRs = issues.filter(i => i.pull_request);
            
            const newContributors = contributors.filter(c => c.contributions < 5);
            const returningContributors = contributors.filter(c => c.contributions >= 5);
            
            const staleIssues = openIssues.filter(i => {
              const lastUpdate = new Date(i.updated_at);
              const now = new Date();
              const daysSinceUpdate = (now - lastUpdate) / (1000 * 60 * 60 * 24);
              return daysSinceUpdate > 14;
            });
            
            const stalePRs = openPRs.filter(pr => {
              const lastUpdate = new Date(pr.updated_at);
              const now = new Date();
              const daysSinceUpdate = (now - lastUpdate) / (1000 * 60 * 60 * 24);
              return daysSinceUpdate > 7;
            });
            
            const staleIssueBodies = staleIssues.map(i => `- [#${i.number}](${i.html_url}): ${i.title}`).slice(0, 10).join('\n');
            const stalePRBodies = stalePRs.map(pr => `- [#${pr.number}](${pr.html_url}): ${pr.title}`).slice(0, 10).join('\n');
            
            const body = `## 👥 Community & Contributor Engagement Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Contributor Overview
            | Metric | Value |
            |--------|-------|
            | Total Contributors | ${contributors.length} |
            | New Contributors (<5 commits) | ${newContributors.length} |
            | Returning Contributors (5+ commits) | ${returningContributors.length} |
            
            ### Stale Items Needing Attention
            | Metric | Value |
            |--------|-------|
            | Stale Issues (>14 days) | ${staleIssues.length} |
            | Stale PRs (>7 days) | ${stalePRs.length} |
            
            ${staleIssues.length > 0 ? `### Stale Issues\n${staleIssueBodies}` : ''}
            
            ${stalePRs.length > 0 ? `### Stale PRs\n${stalePRBodies}` : ''}
            
            ---
            *This issue was automatically generated by the Community Engagement workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `👥 Weekly Engagement Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
