name: PostgreSQL Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surypus_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Run database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: surypus_test
        run: |
          echo "Running migrations..."
          # Run SQL migration files
          for f in sql/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d surypus_test -f "$f" 2>/dev/null || echo "Migration $f skipped"
          done

      - name: Run integration tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: surypus_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/surypus_test
        run: |
          stack test --test-arguments "--match Integration" 2>/dev/null || \
          stack test --test-arguments "--match DB" 2>/dev/null || \
          echo "No integration tests found"

      - name: Run database-specific tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: surypus_test
        run: |
          stack test --test-arguments "--match Repository" 2>/dev/null || \
          stack test --test-arguments "--match Query" 2>/dev/null || \
          echo "No database tests found"
