name: Auto-merge Dependencies

on:
  pull_request:
    types: [opened, synchronize, labeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.ref }}
          check-name: 'CI'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Auto-merge Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          # Only auto-merge patch and minor updates
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          if echo "$PR_TITLE" | grep -qiE "(patch|minor|bump|update)"; then
            gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
          else
            echo "Skipping auto-merge for: $PR_TITLE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge labeled PRs
        if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
