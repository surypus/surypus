name: Contributor Retention

on:
  schedule:
    - cron: '0 11 1 * *'  # Monthly on 1st at 11 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Analyze contributor retention
        uses: actions/github-script@v9
        with:
          script: |
            const { data: contributors } = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Categorize contributors
            const oneTimeContributors = contributors.filter(c => c.contributions === 1);
            const occasionalContributors = contributors.filter(c => c.contributions >= 2 && c.contributions < 5);
            const regularContributors = contributors.filter(c => c.contributions >= 5 && c.contributions < 20);
            const coreContributors = contributors.filter(c => c.contributions >= 20);
            
            // Recent activity (last 30 days)
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            const recentCommits = commits.filter(c => new Date(c.commit.author.date) > thirtyDaysAgo);
            const activeContributors = [...new Set(recentCommits.map(c => c.author?.login).filter(Boolean))];
            
            const body = `## 👥 Contributor Retention Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Contributor Breakdown
            | Category | Count | Description |
            |----------|-------|-------------|
            | One-time | ${oneTimeContributors.length} | 1 contribution |
            | Occasional | ${occasionalContributors.length} | 2-4 contributions |
            | Regular | ${regularContributors.length} | 5-19 contributions |
            | Core | ${coreContributors.length} | 20+ contributions |
            
            ### Recent Activity (Last 30 Days)
            | Metric | Value |
            |--------|-------|
            | Active Contributors | ${activeContributors.length} |
            | Recent Commits | ${recentCommits.length} |
            
            ### Top Contributors
            ${contributors.slice(0, 10).map((c, i) => `${i + 1}. @${c.login}: ${c.contributions} contributions`).join('\n')}
            
            ### Retention Recommendations
            ${oneTimeContributors.length > 0 ? `- 💡 ${oneTimeContributors.length} one-time contributors could be engaged with "good first issue" labels` : ''}
            ${occasionalContributors.length > 0 ? `- 💡 ${occasionalContributors.length} occasional contributors could be mentored to become regulars` : ''}
            ${regularContributors.length > 0 ? `- 💡 ${regularContributors.length} regular contributors are the backbone of the project` : ''}
            ${coreContributors.length > 0 ? `- 💡 ${coreContributors.length} core contributors maintain the project` : ''}
            
            ---
            *This issue was automatically generated by the Contributor Retention workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `👥 Monthly Retention Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
