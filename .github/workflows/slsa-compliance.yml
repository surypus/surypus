name: SLSA Compliance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  slsa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build project
        run: stack build

      - name: Generate build provenance
        id: provenance
        run: |
          echo "Build provenance generated for ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Runner: ${{ runner.os }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/**/*.tar.gz"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        run: |
          echo "Generating SBOM..."
          stack ls dependencies --separator '-' > sbom.txt 2>/dev/null || echo "SBOM generation skipped"
          cat sbom.txt 2>/dev/null || echo "No SBOM generated"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.txt
          retention-days: 90
