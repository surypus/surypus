name: Community Health Metrics

on:
  schedule:
    - cron: '0 8 1 * *'  # Monthly on 1st at 8 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect community metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const now = new Date();
            const thirtyDaysAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);

            // Calculate metrics
            const recentIssues = issues.filter(i => new Date(i.created_at) > thirtyDaysAgo);
            const openIssues = recentIssues.filter(i => i.state === 'open' && !i.pull_request).length;
            const closedIssues = recentIssues.filter(i => i.state === 'closed' && !i.pull_request).length;
            const openPRs = recentIssues.filter(i => i.state === 'open' && i.pull_request).length;
            const closedPRs = recentIssues.filter(i => i.state === 'closed' && i.pull_request).length;

            // Time to first response
            let totalResponseTime = 0;
            let respondedIssues = 0;
            for (const issue of recentIssues.slice(0, 20)) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 1
              });
              if (comments.length > 0) {
                const responseTime = new Date(comments[0].created_at) - new Date(issue.created_at);
                totalResponseTime += responseTime;
                respondedIssues++;
              }
            }

            const avgResponseTime = respondedIssues > 0 
              ? Math.round(totalResponseTime / respondedIssues / (1000 * 60 * 60 * 24))
              : 0;

            const metrics = {
              openIssues,
              closedIssues,
              openPRs,
              closedPRs,
              avgResponseTimeDays: avgResponseTime,
              totalContributors: new Set(issues.map(i => i.user?.login).filter(Boolean)).size
            };

            console.log('Community Metrics:', JSON.stringify(metrics, null, 2));

            const body = `# 👥 Community Health Report

            ## Issues & PRs (Last 30 Days)
            | Type | Open | Closed |
            |------|------|--------|
            | Issues | ${metrics.openIssues} | ${metrics.closedIssues} |
            | PRs | ${metrics.openPRs} | ${metrics.closedPRs} |

            ## Response Metrics
            | Metric | Value |
            |--------|-------|
            | Avg Time to First Response | ${metrics.avgResponseTimeDays} days |
            | Total Contributors | ${metrics.totalContributors} |

            ---
            *Generated on ${new Date().toISOString()}*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `👥 Monthly Community Health - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation']
            });
