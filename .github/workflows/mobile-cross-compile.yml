name: Mobile Cross-compilation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Check iOS cross-compilation support
        run: |
          echo "Checking iOS cross-compilation support..."
          
          # Check if GHC supports ARM64
          ghc --info | grep -i "target" || echo "No target info"
          
          # Check for iOS SDK
          xcodebuild -version 2>/dev/null || echo "Xcode not available"
          
          echo "iOS cross-compilation check completed"

      - name: Build for iOS (experimental)
        continue-on-error: true
        run: |
          echo "Attempting iOS build..."
          # This is experimental and may not work with all dependencies
          stack build --ghc-options="-fllvm" --ghc-options="-optc--target=arm64-apple-ios" 2>/dev/null || \
          echo "iOS build not available with current setup"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Check Android cross-compilation support
        run: |
          echo "Checking Android cross-compilation support..."
          
          # Check for Android SDK
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          
          # Check if GHC supports ARM
          ghc --info | grep -i "target" || echo "No target info"
          
          echo "Android cross-compilation check completed"

      - name: Build for Android (experimental)
        continue-on-error: true
        run: |
          echo "Attempting Android build..."
          # This is experimental and may not work with all dependencies
          stack build --ghc-options="-fllvm" --ghc-options="-optc--target=arm-linux-androideabi" 2>/dev/null || \
          echo "Android build not available with current setup"

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Check WASM support
        run: |
          echo "Checking WASM support..."
          ghc --info | grep -i wasi || echo "No WASI support in GHC"
          
      - name: Build for WASM (experimental)
        continue-on-error: true
        run: |
          echo "Attempting WASM build..."
          stack build --ghc-options="-fllvm" --ghc-options="-optc--target=wasm32-unknown-wasi" 2>/dev/null || \
          echo "WASM build not available with current setup"
