name: Haskell Formatting (Fourmolu)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fourmolu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Fourmolu (non-blocking)
        run: |
          ~/.local/bin/fourmolu --mode check src/ test/ app/ tools/ || \
          echo "Fourmolu: some files need formatting"
