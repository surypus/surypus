name: Auto-Response SLA

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-response:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-respond to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = github.event.issue;
            const body = `## 👋 Thanks for opening this issue!
            
            Hi @${issue.user.login},
            
            Thank you for taking the time to contribute to Surypus! We appreciate your interest in making this project better.
            
            ### What happens next?
            
            - 🔍 **Triage**: A maintainer will review and triage this issue within **48 hours**
            - 💬 **Discussion**: We may ask for clarification or additional details
            - 🏷️ **Labeling**: The issue will be labeled appropriately
            - 📋 **Assignment**: It will be assigned to a maintainer or contributor
            
            ### While you wait
            
            - Check our [Contributing Guidelines](CONTRIBUTING.md)
            - Review existing issues to avoid duplicates
            - Provide as much detail as possible
            
            ---
            *This is an automated response. A maintainer will follow up soon.*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: body
            });

      - name: Auto-respond to new PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = github.event.pull_request;
            const body = `## 👋 Thanks for the pull request!
            
            Hi @${pr.user.login},
            
            Thank you for contributing to Surypus! We appreciate your time and effort.
            
            ### What happens next?
            
            - 🔍 **Review**: A maintainer will review this PR within **48 hours**
            - ✅ **CI Checks**: All automated checks must pass
            - 💬 **Feedback**: We may request changes or ask questions
            - 🎉 **Merge**: Once approved, your PR will be merged
            
            ### PR Checklist
            
            - [ ] Code follows project style guidelines
            - [ ] Tests added for new functionality
            - [ ] Documentation updated
            - [ ] CHANGELOG.md updated
            
            ---
            *This is an automated response. A maintainer will follow up soon.*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: body
            });
