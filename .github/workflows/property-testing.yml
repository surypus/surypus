name: Property-Based Testing (QuickCheck)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quickcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Run QuickCheck property tests
        run: |
          stack test --test-arguments "--quickcheck"

      - name: Run property tests with larger size
        run: |
          # Run with larger test size for thoroughness
          stack test --test-arguments "--quickcheck-tests=1000"
