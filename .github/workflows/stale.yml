name: Stale Issue Management

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs within
            7 days. Thank you for your contributions.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If you believe this is still relevant, please open a new issue
            with updated information.
          stale-issue-label: 'status: needs-triage'
          days-before-issue-stale: 60
          days-before-issue-close: 7
          exempt-issue-labels: |
            security
            priority: critical
            priority: high
            status: blocked
            status: in-review

          # Pull Requests
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has
            not had recent activity. It will be closed if no further activity occurs
            within 14 days.
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
          stale-pr-label: 'status: needs-triage'
          days-before-pr-stale: 14
          days-before-pr-close: 7
          exempt-pr-labels: |
            security
            priority: critical
            status: blocked

          # General
          operations-per-run: 100
          remove-stale-when-updated: true
          debug-only: false
