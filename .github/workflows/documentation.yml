name: Documentation

on:
  pull_request:
    paths:
      - 'src/**/*.hs'
      - 'Surypus.cabal'
      - 'docs/**'
      - 'tools/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized

      - name: Generate module inventory
        run: |
          python3 tools/documentation/generate-inventory.py
          echo "Coverage: $(python3 -c "import json; print(json.load(open('docs/generated/inventory/coverage.json'))['coverage']['percentage'])")%"

      - name: Generate module dependency graph
        run: |
          mkdir -p docs/generated/graphs
          ./tools/documentation/generate-module-graph.sh src docs/generated/graphs/modules.mmd
          wc -l docs/generated/graphs/modules.mmd

      - name: Build MkDocs site (strict)
        run: |
          mkdocs build --strict
          echo -e "\033[32m✓ Documentation built successfully\033[0m"

      - name: Check for documentation drift
        run: |
          python3 -c "import json; d=json.load(open('docs/generated/inventory/modules.json')); undoc=[m['module'] for m in d['modules'] if m['haddock_comments']==0]; print(f'Undocumented modules: {len(undoc)}')"
          python3 -c "import json; d=json.load(open('docs/generated/inventory/modules.json')); print(f'Total modules: {d[\"total_modules\"]}'); print(f'Coverage: {d[\"modules\"][\"coverage\"][\"percentage\"] if \"coverage\" in d.get(\"modules\",{}) else json.load(open(\"docs/generated/inventory/coverage.json\"))[\"coverage\"][\"percentage\"]}%')"

      - name: Check documentation pipeline
        run: bash tools/documentation/check-docs.sh

      - name: Upload generated documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: surypus-documentation
          path: docs/generated/
          retention-days: 14