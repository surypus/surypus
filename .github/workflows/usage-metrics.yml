name: Usage Metrics

on:
  schedule:
    - cron: '0 7 * * 1'  # Weekly on Monday at 7 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect usage metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: clones } = await github.rest.repos.getClones({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: views } = await github.rest.repos.getViews({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: referrers } = await github.rest.repos.getTopReferrers({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: popular } = await github.rest.repos.getTopPaths({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const body = `## 📈 Usage Metrics Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Traffic
            | Metric | Value |
            |--------|-------|
            | Views | ${views.count} |
            | Unique Visitors | ${views.uniques} |
            | Clones | ${clones.count} |
            | Unique Cloners | ${clones.uniques} |
            
            ### Top Referrers
            ${referrers.slice(0, 5).map(r => `- ${r.referrer}: ${r.count} (${r.uniques} unique)`).join('\n')}
            
            ### Popular Content
            ${popular.slice(0, 5).map(p => `- ${p.path}: ${p.count} (${p.uniques} unique)`).join('\n')}
            
            ---
            *This issue was automatically generated by the Usage Metrics workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Weekly Usage Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
