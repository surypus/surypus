name: Haskell Linting (HLint)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Install and run HLint
        run: |
          stack install hlint
          ~/.local/bin/hlint src/ test/ app/ tools/ --report=hlint-report.html || true
          echo "HLint check completed"

      - name: Upload HLint report
        uses: actions/upload-artifact@v7
        with:
          name: hlint-report
          path: hlint-report.html
          retention-days: 7
