name: GraphQL API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  graphql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Install GraphQL dependencies
        run: |
          echo "Installing GraphQL dependencies..."
          # Add morpheus-graphql or similar to stack.yaml
          # stack install morpheus-graphql

      - name: Generate GraphQL schema
        run: |
          echo "Generating GraphQL schema..."
          # Generate schema from Haskell types
          stack build 2>/dev/null || true
          stack exec surypus -- --generate-graphql-schema > graphql-schema.graphql 2>/dev/null || \
          echo "GraphQL schema generation skipped"

      - name: Validate GraphQL schema
        run: |
          if [ -f "graphql-schema.graphql" ]; then
            echo "GraphQL schema generated successfully"
            head -20 graphql-schema.graphql
          else
            echo "No GraphQL schema file found"
          fi

      - name: Upload schema artifact
        uses: actions/upload-artifact@v7
        with:
          name: graphql-schema
          path: graphql-schema.graphql
          retention-days: 7
