name: Promotion Metrics

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect promotion metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: views } = await github.rest.repos.getViews({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: clones } = await github.rest.repos.getClones({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: referrers } = await github.rest.repos.getTopReferrers({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const { data: popular } = await github.rest.repos.getTopPaths({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const body = `## 📊 Promotion Metrics Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            
            ### Awareness Metrics
            | Metric | Value |
            |--------|-------|
            | ⭐ Stars | ${repo.stargazers_count} |
            | 🍴 Forks | ${repo.forks_count} |
            | 👥 Watchers | ${repo.watchers_count} |
            | 👀 Views | ${views.count} |
            | 👤 Unique Visitors | ${views.uniques} |
            | 📥 Clones | ${clones.count} |
            | 👤 Unique Cloners | ${clones.uniques} |
            
            ### Top Referrers
            ${referrers.slice(0, 5).map(r => `- ${r.referrer}: ${r.count} (${r.uniques} unique)`).join('\n')}
            
            ### Popular Content
            ${popular.slice(0, 5).map(p => `- ${p.path}: ${p.count} (${p.uniques} unique)`).join('\n')}
            
            ### Promotion Channels
            - [GitHub](https://github.com/surypus/surypus)
            - [Website](https://surypus.github.io)
            - [Twitter](https://twitter.com/surypus)
            
            ### Next Steps
            - [ ] Share on social media
            - [ ] Write blog post
            - [ ] Engage with community
            - [ ] Present at conference
            
            ---
            *This issue was automatically generated by the Promotion Metrics workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Promotion Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation', 'status: needs-triage']
            });
