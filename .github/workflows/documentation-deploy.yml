name: Documentation Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-documentation:
    name: Deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: docs-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.12'
          enable-stack: false

      - name: Restore cabal cache
        uses: actions/cache@v4
        with:
          path: |
            dist-newstyle
            ~/.cabal
          key: ${{ runner.os }}-cabal-${{ hashFiles('Surypus.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-cabal-

      - name: Install beads
        run: |
          curl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash

      - name: Install dolt
        run: |
          # beads' dolt backend needs the dolt binary; the runner has neither.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/dolt.tgz \
            "https://github.com/dolthub/dolt/releases/download/v2.5.0/dolt-linux-amd64.tar.gz"
          tar xzf /tmp/dolt.tgz -C /tmp
          install -m 0755 /tmp/dolt-linux-amd64/bin/dolt "$HOME/.local/bin/dolt"
          "$HOME/.local/bin/dolt" version

      - name: Generate module inventory
        run: python3 tools/documentation/generate-inventory.py

      - name: Generate module dependency graph
        run: |
          mkdir -p docs/generated/graphs
          bash tools/documentation/generate-module-graph.sh src docs/generated/graphs/modules.mmd

      - name: Generate Haddock documentation
        run: |
          # Haddock lands under dist-newstyle for a cabal build. Build with
          # documentation enabled, then copy the HTML tree into the docs.
          cabal build all --enable-documentation --haddock-hyperlink-source
          mkdir -p docs/generated/haddock
          HADDOCK_SRC="$(find dist-newstyle/build -type d -name html -path '*doc/html' | head -1)"
          if [ -z "$HADDOCK_SRC" ]; then
            echo "Haddock output not found under dist-newstyle; skipping"
            exit 0
          fi
          cp -r "$HADDOCK_SRC"/. docs/generated/haddock/
          # Haddock drops a README.md next to index.html, which mkdocs rejects
          # as a conflict; it is redundant with the generated index page.
          find docs/generated/haddock -name 'README.md' -delete
          echo "Haddock pages: $(find docs/generated/haddock -name '*.html' | wc -l)"

      - name: Generate task pages from beads
        run: |
          mkdir -p docs/tasks
          export PATH="$HOME/.local/bin:$PATH"
          bd dolt start >/dev/null 2>&1 || true
          # beads is an optional task source: when its dolt backend is
          # unavailable the rest of the site must still build, so this step
          # is best-effort rather than fatal.
          python3 tools/beads-sync-github.py --wiki-dir docs/tasks

      - name: Build documentation site
        run: |
          mkdocs build --strict
          du -sh site/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true