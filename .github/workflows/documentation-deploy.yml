name: Documentation Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write   # required to push the built site to the gh-pages branch
  pages: write
  id-token: write

jobs:
  deploy-documentation:
    name: Deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    concurrency:
      group: docs-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Hugo / MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material 2>&1 | tail -5

      - name: Generate task pages from beads
        run: |
          # The task list lives in beads; render the same pages the GitHub wiki
          # gets into docs/tasks/ so the site stays in sync with the tracker.
          if command -v bd >/dev/null 2>&1; then
            mkdir -p docs/tasks
            python3 tools/beads-sync-github.py --wiki-dir docs/tasks --require-beads
          else
            echo "bd not on PATH; installing beads"
            curl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p docs/tasks
            python3 tools/beads-sync-github.py --wiki-dir docs/tasks
          fi

      - name: Build documentation site
        run: |
          mkdocs build --strict 2>&1 | tail -20

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
