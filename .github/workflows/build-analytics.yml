name: Build Analytics

on:
  schedule:
    - cron: '0 7 * * 1'  # Weekly on Monday at 7 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect build metrics
        uses: actions/github-script@v9
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30
            });

            const metrics = {
              total: runs.total_count,
              success: runs.workflow_runs.filter(r => r.conclusion === 'success').length,
              failure: runs.workflow_runs.filter(r => r.conclusion === 'failure').length,
              avgDuration: 0
            };

            const durations = runs.workflow_runs
              .filter(r => r.conclusion === 'success')
              .map(r => new Date(r.updated_at) - new Date(r.created_at));
            
            if (durations.length > 0) {
              metrics.avgDuration = Math.round(durations.reduce((a, b) => a + b, 0) / durations.length / 1000);
            }

            console.log('Build Metrics:', JSON.stringify(metrics, null, 2));

            const body = `# 📈 Build Analytics Report

            ## Summary
            | Metric | Value |
            |--------|-------|
            | Total Runs | ${metrics.total} |
            | Success | ${metrics.success} |
            | Failure | ${metrics.failure} |
            | Success Rate | ${((metrics.success / metrics.total) * 100).toFixed(1)}% |
            | Avg Duration | ${metrics.avgDuration}s |

            ---
            *Generated on ${new Date().toISOString()}*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Weekly Build Analytics - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['documentation']
            });
