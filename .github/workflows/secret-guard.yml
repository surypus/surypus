name: Secret Guard

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for exposed high-entropy secrets
        run: |
          set -euo pipefail
          # Exclude self to avoid false positives from its own regex patterns
          RESULT=$(grep -RInE "(ghp_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9_]{36,}|ghr_[A-Za-z0-9_]{36,}|ghs_[A-Za-z0-9_]{36,}|ghu_[A-Za-z0-9_]{36,}|ghx_[A-Za-z0-9_]{36,}|readthedocs.*api.*key|readthedocs.*token|api[_-]?key[=:]['\"]?[A-Za-z0-9+/]{32,})" \
            .github docs tools .readthedocs.yml AGENTS.md 2>/dev/null | \
            grep -v "secret-guard.yml" | grep -v "ci.yml" || true)
          
          if [ -n "$RESULT" ]; then
            echo "Potential secret pattern found in tracked files:"
            echo "$RESULT"
            exit 1
          fi
          echo "No obvious secret patterns found in tracked files."
