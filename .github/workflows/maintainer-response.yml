name: Maintainer Response Bot

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  response-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if maintainer needs reminder
        uses: actions/github-script@v9
        with:
          script: |
            const { name, payload } = context;
            const itemType = payload.issue ? 'issue' : 'pull_request';
            const item = payload.issue || payload.pull_request;
            
            // Only act on items older than 48 hours without maintainer response
            const createdAt = new Date(item.created_at);
            const now = new Date();
            const hoursSinceCreated = (now - createdAt) / (1000 * 60 * 60);
            
            if (hoursSinceCreated < 48) {
              console.log(`Skipping - item is only ${hoursSinceCreated.toFixed(1)} hours old`);
              return;
            }
            
            // Check for maintainer comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              per_page: 100
            });
            
            const maintainerComments = comments.filter(c => 
              c.user?.login === 'dominicusin' || 
              c.user?.type === 'Bot' ||
              c.author_association === 'OWNER'
            );
            
            if (maintainerComments.length > 0) {
              console.log('Maintainer already responded');
              return;
            }
            
            // Remind maintainers
            const body = `## ⏰ Reminder: This ${itemType} needs attention
            
            This ${itemType} was created ${Math.round(hoursSinceCreated)} hours ago and hasn't received a maintainer response yet.
            
            Our [Expectations](EXPECTATIONS.md) state:
            - Bug reports: Response within 48 hours
            - PRs: Response within 48 hours
            
            @dominicusin - please triage this ${itemType}.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              body: body
            });
