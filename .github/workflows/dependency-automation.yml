name: Dependency Automation

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 4 AM
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Check for outdated dependencies
        id: outdated
        run: |
          echo "Checking for outdated dependencies..."
          stack ls dependencies --separator '-' > current-deps.txt
          
          # Check for outdated packages (if cabal-outdated is available)
          stack install cabal-outdated 2>/dev/null || echo "cabal-outdated not available"
          
          if command -v cabal-outdated &> /dev/null; then
            cabal-outdated 2>/dev/null || true
          fi
          
          # Generate outdated report
          echo "## Outdated Dependencies Report" > outdated-report.md
          echo "" >> outdated-report.md
          echo "Generated on: $(date -u)" >> outdated-report.md
          echo "" >> outdated-report.md
          echo '```' >> outdated-report.md
          cat current-deps.txt >> outdated-report.md
          echo '```' >> outdated-report.md
          
          cat outdated-report.md

      - name: Create issue for outdated deps
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('outdated-report.md', 'utf8');
            
            // Check if there's already an open outdated deps issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['dependencies', 'status: needs-triage'],
              state: 'open'
            });
            
            const existingIssue = issues.find(i => i.title.includes('Outdated Dependencies'));
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Weekly Outdated Dependencies Report',
                body: report,
                labels: ['dependencies', 'documentation']
              });
            }

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Update lockfile
        run: |
          stack update 2>/dev/null || true
          stack freeze 2>/dev/null || true
          
      - name: Check for lockfile changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update stack lockfile"
          title: "chore: update stack lockfile"
          body: |
            Automated lockfile update from Stack.
            
            This PR updates `stack.yaml.lock` to the latest resolver.
          labels: dependencies
          branch: chore/update-lockfile
          delete-branch: true
