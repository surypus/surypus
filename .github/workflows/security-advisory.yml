name: Security Advisory Automation

on:
  schedule:
    - cron: '0 5 * * 3'  # Weekly on Wednesday at 5 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  advisory-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for open security advisories
        uses: actions/github-script@v9
        with:
          script: |
            const { data: advisories } = await github.rest.repos.listAlerts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            if (advisories.length > 0) {
              console.log(`Found ${advisories.length} open security advisories`);
              
              const body = `# 🔒 Security Advisory Report\n\n` +
                `**Open Advisories:** ${advisories.length}\n\n` +
                `## Summary\n\n` +
                advisories.map(a => `- ${a.secret_type}: ${a.created_at}`).join('\n');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Weekly Security Report - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['security', 'status: needs-triage']
              });
            } else {
              console.log('No open security advisories');
            }

      - name: Check secret scanning status
        uses: actions/github-script@v9
        with:
          script: |
            const { data: alerts } = await github.rest.secretScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            console.log(`Secret scanning alerts: ${alerts.length}`);
            
            if (alerts.length > 0) {
              const body = `# 🚨 Secret Scanning Alert\n\n` +
                `**Open Alerts:** ${alerts.length}\n\n` +
                `Please review and resolve these alerts immediately.`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Secret Scanning Alert - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['security', 'priority: critical', 'status: needs-triage']
              });
            }
