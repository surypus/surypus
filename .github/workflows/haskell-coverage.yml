name: Haskell Code Coverage (hpc-codecov)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surypus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build with coverage
        run: |
          stack build --coverage --test --no-run-tests

      - name: Run tests with coverage
        run: |
          stack test --coverage

      - name: Generate coverage report
        run: |
          stack hpc-codecov --json > coverage.json 2>/dev/null || \
          stack hpc-codecov -o coverage.json 2>/dev/null || \
          echo "hpc-codecov not available, using basic coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: coverage.json
          flags: unittests
          name: surypus-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
