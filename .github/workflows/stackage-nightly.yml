name: Stackage Nightly Auto-PR

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  nightly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Configure Stack Nightly
        run: |
          stack config set resolver nightly
          echo "Using resolver: nightly"

      - name: Build with Stack Nightly
        continue-on-error: true
        id: build
        run: |
          stack build --test --no-run-tests 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.build.outputs.status == 'success'
        continue-on-error: true
        id: test
        run: |
          stack test 2>&1 | tee test.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on failure
        if: steps.build.outputs.status == 'failure' || steps.test.outputs.status == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const buildLog = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8').slice(-2000) : '';
            const testLog = fs.existsSync('test.log') ? fs.readFileSync('test.log', 'utf8').slice(-2000) : '';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Nightly build failed - ${new Date().toISOString().split('T')[0]}`,
              body: `Stack Nightly build failed.\n\n### Build Status\n- Build: ${steps.build.outputs.status}\n- Test: ${steps.test.outputs.status}\n\n### Logs\n\`\`\`\n${buildLog}\n\`\`\`\n\n\`\`\`\n${testLog}\n\`\`\``,
              labels: ['bug', 'priority: high', 'status: needs-triage']
            })

      - name: Create PR on success
        if: steps.build.outputs.status == 'success' && steps.test.outputs.status == 'success'
        run: |
          echo "Stack Nightly build passed - no action needed"
