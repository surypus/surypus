name: Haskell Autotag

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  autotag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse Cabal File
        id: parse
        run: |
          VERSION=$(grep -E "^version:" Surypus.cabal | head -1 | sed 's/.*:\s*//')
          NAME=$(grep -E "^name:" Surypus.cabal | head -1 | sed 's/.*:\s*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Parsed: $NAME v$VERSION"

      - name: Create Git tag on version bump
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping..."
            exit 0
          fi
          echo "Creating release tag $TAG from $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
