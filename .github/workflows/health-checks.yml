name: Health Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surypus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build project
        run: |
          stack build

      - name: Run health check tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: surypus_test
          REDIS_URL: redis://localhost:6379
        run: |
          echo "Testing health checks..."
          stack test --test-arguments "--match Health" 2>/dev/null || \
          echo "No health check tests found"

      - name: Test liveness probe
        run: |
          echo "Testing liveness probe..."
          curl -f http://localhost:8080/health/live 2>/dev/null || \
          echo "Liveness probe not available"

      - name: Test readiness probe
        run: |
          echo "Testing readiness probe..."
          curl -f http://localhost:8080/health/ready 2>/dev/null || \
          echo "Readiness probe not available"

      - name: Test startup probe
        run: |
          echo "Testing startup probe..."
          curl -f http://localhost:8080/health/startup 2>/dev/null || \
          echo "Startup probe not available"
