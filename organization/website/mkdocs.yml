site_name: Surypus
site_description: Surypus ERP/CRM - Haskell implementation with formal verification
repo_url: https://github.com/surypus/surypus
repo_name: surypus/surypus

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Projects:
    - Surypus ERP/CRM: projects/surypus.md
    - Roadmap: projects/roadmap.md
  - Contributing:
    - Code of Conduct: contributing/code-of-conduct.md
    - How to Contribute: contributing/contributing.md
    - Architecture: contributing/architecture.md
  - Security:
    - Security Policy: security/policy.md
    - Advisories: security/advisories.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/surypus
