# docs/mkdocs.yml
site_name: Surypus ERP
site_description: ERP-система полного цикла на Haskell с формальной верификацией
site_url: https://surypus.github.io/surypus/
repo_url: https://github.com/surypus/surypus
repo_name: surypus/surypus

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  language: ru
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - sane_lists
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.arithmatex
  - pymdownx.tasklist

nav:
  - Главная: index.md
  - Архитектура: ARCHITECTURE.md
  - Система типов: TYPES.md
  - API: API.md
  - Хранилище данных: DATABASE.md
  - Развёртывание: DEPLOYMENT.md
  - Руководство: GUIDE.md
  - Руководства:
      - Как работает бухгалтерия: guides/accounting.md
      - Как работает инвентарь: guides/inventory.md
      - Как работает RBAC: guides/rbac.md
      - Как работает JWT-аутентификация: guides/jwt.md
      - Как работает персистентность: guides/persistence.md
      - Как работает Event Store: guides/event-store.md
  - ADR:
      - "ADR-001: Haskell как основной язык": adr/0001-haskell-primary-language.md
      - "ADR-002: MkDocs для сайта документации": adr/0002-mkdocs-site.md
  - Архитектура событий: architecture/EVENT_SOURCING.md
  - Инженерные модули:
      - API-конвенции: engineering/api-conventions.md
      - Bill-модуль: engineering/bill-module.md
      - Document-модуль: engineering/document-module.md
      - HR/Payroll-модуль: engineering/hr-payroll-module.md
      - Job Server ETL: engineering/job-server-etl.md
      - Person-модуль: engineering/person-module.md
      - Production-модуль: engineering/production-module.md
      - Reports Portal: engineering/reports-portal.md
      - Schema уникальность: engineering/schema-uniqueness.md
      - Руководство по тестированию: engineering/testing-guide.md
  - Примеры: examples/EXAMPLES.md
  - Рефиниции: REFINEMENT.md
  - Сводка: SUMMARY.md
  - Задачи:
      - Обзор: tasks/Home.md
      - Планы: tasks/Plans.md
      - Бэклог: tasks/Backlog.md
  - Сгенерировано:
      - Состояние документации: generated/health.md
      - Покрытие: generated/inventory/coverage.md
      - Каталог модулей: generated/inventory/modules.md
      - Функции: generated/inventory/functions.md
      - Граф зависимостей: generated/graphs/index.md
      - Haddock API: generated/haddock/Surypus/index.html