# docs/mkdocs.yml
site_name: Surypus ERP
site_description: ERP-система полного цикла на Haskell с формальной верификацией
site_url: https://dominicusin.github.io/Surypus/
repo_url: https://github.com/dominicusin/Surypus
repo_name: dominicusin/Surypus

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  language: ru
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - sane_lists
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:

  - Главная: index.md
  - Архитектура: ARCHITECTURE.md
  - Система типов: TYPES.md
  - API: API.md
  - Хранилище данных: DATABASE.md
  - Развёртывание: DEPLOYMENT.md
  - Руководство: GUIDE.md
  - Руководства:
      - Как работает бухгалтерия: guides/accounting.md
      - Как работает инвентарь: guides/inventory.md
      - Как работает RBAC: guides/rbac.md
      - Как работает JWT-аутентификация: guides/jwt.md
      - Как работает персистентность: guides/persistence.md
      - Как работает Event Store: guides/event-store.md
  - ADR:
      - "ADR-001: Haskell как основной язык": adr/0001-haskell-primary-language.md
      - "ADR-002: MkDocs для сайта документации": adr/0002-mkdocs-site.md
  - Архитектура событий: architecture/EVENT_SOURCING.md
  - Инженерные модули:
      - api-conventions.md: engineering/api-conventions.md
      - bill-module.md: engineering/bill-module.md
      - document-module.md: engineering/document-module.md
      - hr-payroll-module.md: engineering/hr-payroll-module.md
      - job-server-etl.md: engineering/job-server-etl.md
      - person-module.md: engineering/person-module.md
      - production-module.md: engineering/production-module.md
      - reports-portal.md: engineering/reports-portal.md
      - schema-uniqueness.md: engineering/schema-uniqueness.md
      - testing-guide.md: engineering/testing-guide.md
  - Примеры: examples/EXAMPLES.md
  - Рефиниции: REFINEMENT.md
  - Сводка: SUMMARY.md
  - Задачи:
      - Обзор: tasks/Home.md
      - Планы: tasks/Plans.md
      - Бэклог: tasks/Backlog.md
