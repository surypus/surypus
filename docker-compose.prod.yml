# Production override: deploy the published GHCR image instead of building locally.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    image: ghcr.io/surypus/surypus:latest
    build: !reset null
    pull_policy: always
